<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社Sfinity</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #f9f8ff;
      --surface: #ffffff;
      --text: #1a1625;
      --muted: #645d75;
      --line: #e2e0ed;
      --accent: #7c3aed;
      --accent-deep: #4c1d95;
      --accent-light: #a78bfa;
      --shadow: 0 18px 40px rgba(124, 58, 237, 0.12);
      --max-width: 1080px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.12), transparent 28%),
        linear-gradient(180deg, #fbfaff 0%, #f3f0ff 100%);
    }

    a { color: inherit; text-decoration: none; }
    .container { width: min(calc(100% - 40px), var(--max-width)); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      background: rgba(251, 250, 255, 0.82);
      border-bottom: 1px solid rgba(226, 224, 237, 0.8);
    }

    .nav { display: flex; align-items: center; justify-content: space-between; min-height: 72px; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      color: #fff; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      box-shadow: var(--shadow);
    }

    .nav-links { display: flex; gap: 24px; color: var(--muted); font-size: 0.95rem; }
    .hero { padding: 88px 0 56px; }
    h1 { margin: 18px 0 18px; font-size: clamp(2.4rem, 5vw, 4.6rem); line-height: 1.08; letter-spacing: -0.04em; }
    .lead { margin: 0; max-width: 640px; color: var(--muted); font-size: 1.06rem; line-height: 1.8; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }

    .button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button.primary { color: #fff; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); box-shadow: var(--shadow); }

    section { padding: 48px 0 72px; }
    .section-title { margin: 0 0 10px; font-size: 2rem; letter-spacing: -0.03em; }
    .section-copy { margin: 0 0 26px; max-width: 620px; color: var(--muted); line-height: 1.8; }
    
    .cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 18px; 
    }
    
    .card {
      padding: 24px; border-radius: 24px; background: var(--surface);
      border: 1px solid var(--line); box-shadow: 0 12px 24px rgba(26, 22, 37, 0.04);
      transition: all 0.2s ease;
    }
    .card:hover { 
      border-color: var(--accent); 
      box-shadow: 0 14px 28px rgba(124, 58, 237, 0.08);
    }
    .card h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.15rem; }
    .card p { margin: 0; color: var(--muted); line-height: 1.8; }

    footer { padding: 44px 0 64px; color: var(--muted); font-size: 0.95rem; border-top: 1px solid var(--line); }

    @media (max-width: 900px) {
      .cards { grid-template-columns: 1fr; }
      .nav { flex-direction: column; padding: 14px 0; }
      .nav-links { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="#top">
        <span class="brand-mark">S</span>
        <span>株式会社Sfinity</span>
      </a>
      <nav class="nav-links">
        <a href="#services">事業内容</a>
        </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container">
        <h1>挑む企業の成長を、<br>最短ルートで加速する。</h1>
        <p class="lead">株式会社Sfinityは、企業の課題を整理し、戦略と実行で前に進めるパートナーです。<br>丁寧で確かな支援を提供します。</p>
      </div>
    </section>

    <section id="services">
      <div class="container">
        <h2 class="section-title">事業内容</h2>
        <p class="section-copy">確かな成果につながるサービスを提供しています。</p>
        <div class="cards">
          <article class="card">
            <h3>コンサルティング</h3>
            <p>経営課題を整理し、具体的な改善施策と実行計画を設計します。</p>
          </article>
          <article class="card">
            <h3>システム構築</h3>
            <p>ビジネスの要件に最適化されたIT基盤の設計・開発を行い、<br>業務のデジタル化を推進します。</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">© 2026 株式会社Sfinity All Rights Reserved.</div>
  </footer>
</body>
</html>
