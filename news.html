<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News - 株式会社Sfinity</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #EFEFEF;
      scroll-behavior: smooth;
      font-family: 'Inter', 'DM Sans', sans-serif;
    }
    
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ヘッダー */
    .header {
      width: 100%;
      min-height: 92px;
      padding: 16px 32px;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-item {
      color: black;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* フッター */
    .footer {
      width: 100%;
      min-height: 222px;
      padding: 60px 32px 32px 32px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      margin-top: auto;
    }

    .footer-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 65px;
      box-sizing: border-box;
    }

    .footer-links {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 60px;
    }

    .footer-bottom {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ==========================================
       レスポンシブ対応 (画面幅 768px 以下)
    ========================================== */
    @media screen and (max-width: 768px) {
      .header {
        flex-direction: column;
        padding: 16px;
        gap: 16px;
        height: auto;
      }

      .nav-list {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-item {
        font-size: 15px;
      }

      .footer-inner {
        gap: 32px;
      }

      .footer-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      .footer-links {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

<div style="width: 100%; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-sizing: border-box;">
  
  <header class="header">
    <a href="index.html" style="display: flex; align-items: center; gap: 8px;">
      <img src="images/仮ロゴ.png" alt="Sfinity Logo" style="width: 30px; height: 30px; object-fit: contain; flex-shrink: 0;">
      <div style="color: #9100FF; font-size: 28px; font-weight: 700; line-height: 1;">Sfinity</div>
    </a>
    
    <nav class="nav-list">
      <span class="nav-item">ニュース</span>
      <a href="index.html#services" class="nav-item">事業概要</a>
      <a href="index.html#company" class="nav-item">会社概要</a>
      <a href="index.html#contact" class="nav-item">お問い合わせ</a>
    </nav>
  </header>

  <div style="width: 100%; padding-left: 32px; padding-right: 32px; padding-top: 79px; padding-bottom: 79px; flex-direction: column; justify-content: flex-start; align-items: center; gap: 10px; display: flex; flex: 1; box-sizing: border-box; background-image: url('images/Background.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; overflow: hidden;">
    <div style="width: 100%; max-width: 680px; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 60px; display: flex">
      <div style="align-self: stretch; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 24px; display: flex">
        <div style="align-self: stretch; color: black; font-size: 64px; font-family: Inter; font-weight: 700; word-wrap: break-word">ニュース</div>
        
        <div style="align-self: stretch; padding-left: 10px; padding-right: 10px; padding-top: 20px; padding-bottom: 20px; border-top: 1px #CCCCCC solid; border-bottom: 1px #CCCCCC solid; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 13px; display: flex">
          <div style="align-self: stretch; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 24px; display: flex">
            <div style="align-self: stretch; color: #9100FF; font-size: 18px; font-family: Inter; font-weight: 400; line-height: 30px; word-wrap: break-word">2026.07.24</div>
          </div>
          
          <a href="notices/financial-statement-20260714.pdf" target="_blank" rel="noopener noreferrer" style="align-self: stretch; justify-content: flex-start; align-items: center; gap: 10px; display: inline-flex; text-decoration: none;">
            <div style="color: black; font-size: 18px; font-family: Inter; font-weight: 400; line-height: 30px; word-wrap: break-word;">2025年の決算資料を公開しました</div>
            <div style="width: 24px; height: 24px; border: 1.5px solid #E2574C; border-radius: 4px; display: flex; justify-content: center; align-items: center; background: #FFF3F2; color: #E2574C; font-size: 9px; font-weight: bold; font-family: sans-serif; box-sizing: border-box;">PDF</div>
          </a>
          </div>

      </div>
    </div>
  </div>

  <footer class="footer" style="background-image: url('images/Footer.jpg');">
    <div class="footer-inner">
      
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="images/仮ロゴ.png" alt="Sfinity Logo" style="width: 30px; height: 30px; object-fit: contain; flex-shrink: 0;">
        <div style="color: white; font-size: 28px; font-weight: 700; line-height: 1;">Sfinity</div>
      </div>

      <div class="footer-bottom">
        <div class="footer-links">
          <a href="https://sfinity.co.jp/security-policy" style="color: white; font-size: 16px; line-height: 20px;">情報セキュリティ方針</a>
          <a href="https://sfinity.co.jp/privacy-policy" style="color: white; font-size: 16px; line-height: 20px;">プライバシーポリシー</a>
        </div>
        <div style="color: white; font-size: 20px; font-family: Inter;">© 2026 Sfinity Co., Ltd. All Rights Reserved.</div>
      </div>

    </div>
  </footer>

</div>

</body>
</html>
